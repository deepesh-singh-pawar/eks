# Ingress describes HTTP routing intent; aws-load-balancer-controller turns this into AWS ALB resources.
#
# ingressClassName: "alb" is created when you install aws-load-balancer-controller with default settings.
# target-type ip registers Pod IPs directly — works well with Fargate and improves behavior for sticky sessions in some setups.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
  namespace: demo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing # Public ALB in your public subnets
    alb.ingress.kubernetes.io/target-type: ip       # Targets Pod IPs (not Instance mode)
spec:
  ingressClassName: alb # Must exist after Helm install — see helm/aws-load-balancer-controller-values.yaml
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app
                port:
                  number: 80
